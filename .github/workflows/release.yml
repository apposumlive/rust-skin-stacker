name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Здесь работает код зависимостей (npm, cargo, сборочные скрипты),
  # поэтому только чтение: ни записи в репозиторий, ни подписи, ни GITHUB_TOKEN.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-24.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # До npm ci: читается только JSON, код зависимостей ещё не запускался.
      - name: Tag matches the app version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "Tag $TAG matches version $version"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: npm run tauri build -- --bundles "$BUNDLES"

      - name: Collect files
        shell: bash
        run: |
          mkdir release-files
          for f in src-tauri/target/release/bundle/*/*; do
            case "$f" in
              *.exe|*.msi|*.AppImage|*.deb|*.rpm) cp "$f" "release-files/$(basename "$f" | tr ' ' '.')" ;;
            esac
          done
          ls -l release-files

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: files-${{ runner.os }}
          path: release-files/*
          if-no-files-found: error
          overwrite: true

  # Права на запись и подпись — только здесь. Код проекта и зависимостей здесь не запускается:
  # нет checkout, npm и cargo, только готовые файлы из build.
  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # черновик релиза
      id-token: write # подтверждение происхождения
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: files-*
          merge-multiple: true
          path: files

      - name: SHA256SUMS
        working-directory: files
        run: |
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: files/*

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          NOTES: |
            Builds for Windows and Linux. Not affiliated with Valve or Facepunch.

            **Which file to download**

            | System | File |
            |---|---|
            | Windows 10/11 | `…_x64-setup.exe` — installer; take this one if unsure |
            | Windows 10/11, managed PCs | `…_x64_en-US.msi` |
            | Linux, any distribution | `….AppImage` — allow it to run, then open it |
            | Ubuntu, Debian | `….deb` |
            | Fedora | `….rpm` |

            Linux builds need glibc 2.39 or newer: Ubuntu 24.04+, Debian 13+, Fedora 40+.

            **Check a file before you run it**
            - Checksum: compare the file with `SHA256SUMS` — `sha256sum -c SHA256SUMS --ignore-missing` on Linux, `Get-FileHash <file>` on Windows.
            - Provenance: `gh attestation verify <file> --repo ${{ github.repository }}`
              It needs the [GitHub CLI](https://cli.github.com/), signed in with `gh auth login`.

            Windows SmartScreen may warn about an unsigned app. The README explains what to do.

            ---

            **Какой файл скачать**

            | Система | Файл |
            |---|---|
            | Windows 10/11 | `…_x64-setup.exe` — установщик; если не знаете, что выбрать, берите его |
            | Windows 10/11, рабочие компьютеры с политиками | `…_x64_en-US.msi` |
            | Linux, любой дистрибутив | `….AppImage` — разрешите запуск и откройте |
            | Ubuntu, Debian | `….deb` |
            | Fedora | `….rpm` |

            Сборкам для Linux нужна glibc 2.39 или новее: Ubuntu 24.04+, Debian 13+, Fedora 40+.
            Не связано с Valve и Facepunch. Как проверить файл и что делать с предупреждением SmartScreen — в [README на русском](https://github.com/${{ github.repository }}/blob/main/README.ru.md).
        run: |
          gh release create "$TAG" --verify-tag --draft --title "Rust Skin Stacker $TAG" --notes "$NOTES" --repo "$REPO" files/* SHA256SUMS
