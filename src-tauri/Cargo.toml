[package]
name = "rust-skin-stacker"
version = "0.2.0"
description = "Split and combine stacks of Rust skins in your Steam inventory"
authors = ["Rust Skin Stacker contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/apposumlive/rust-skin-stacker"
homepage = "https://github.com/apposumlive/rust-skin-stacker"
edition = "2024"
rust-version = "1.90"

[lib]
# Суффикс _lib: на Windows имя библиотеки не должно совпадать с именем программы.
name = "rust_skin_stacker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
base64 = "0.23.1"
regex = "1"
url = "2.5.8"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["macros", "time", "sync"] }

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
